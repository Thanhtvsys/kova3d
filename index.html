<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KOVA3d/title>
  <style>
    :root {
      --bg-color: #0f0f0f;
      --card-bg: #181818;
      --accent-color: #DB5304;
      --accent-hover: #ff6a1a;
      --text-color: #ffffff;
      --text-dim: #aaaaaa;
      --border-color: #272727;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex; flex-direction: column; min-height: 100vh;
    }

    header {
      background-color: #000000;
      border-bottom: 1px solid var(--border-color);
      padding: 12px 20px;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 15px;
      position: sticky; top: 0; z-index: 100;
    }

    .logo {
      font-size: 1.3rem; font-weight: bold; color: var(--accent-color);
      text-decoration: none; cursor: pointer; display: flex; align-items: center; gap: 8px;
    }

    .search-box { display: flex; flex: 1; max-width: 550px; gap: 8px; }
    .search-box input {
      flex: 1; padding: 10px 16px; border-radius: 20px;
      border: 1px solid var(--border-color); background-color: var(--card-bg);
      color: #fff; font-size: 0.95rem; outline: none;
    }
    .search-box input:focus { border-color: var(--accent-color); }
    .search-box button {
      padding: 10px 20px; border-radius: 20px; border: none;
      background-color: var(--accent-color); color: #fff; font-weight: bold; cursor: pointer;
    }

    main { display: flex; flex-direction: column; padding: 20px; max-width: 1400px; margin: 0 auto; width: 100%; gap: 20px; }

    /* Server Bar */
    .server-bar {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
      background: var(--card-bg); padding: 10px 16px; border-radius: 8px; border: 1px solid var(--border-color);
    }
    .server-options { display: flex; gap: 8px; flex-wrap: wrap; }
    .server-btn {
      padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border-color);
      background: #252525; color: #fff; cursor: pointer; font-size: 0.85rem; transition: 0.2s;
    }
    .server-btn.active { background: var(--accent-color); border-color: var(--accent-color); font-weight: bold; }

    /* Player */
    .player-section {
      width: 100%; background-color: #000; border-radius: 12px; overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6); border: 1px solid var(--border-color);
    }
    .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; background: #000; }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    .video-info { padding: 16px 20px; }
    .video-title { font-size: 1.2rem; font-weight: 600; color: #fff; }

    /* Section Header & Refresh */
    .section-header {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
      margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;
    }
    .section-title { font-size: 1.2rem; font-weight: 700; color: var(--accent-color); }
    .refresh-btn {
      padding: 6px 14px; border-radius: 20px; border: 1px solid var(--accent-color);
      background: transparent; color: var(--accent-color); cursor: pointer; font-size: 0.85rem; transition: 0.2s;
    }
    .refresh-btn:hover { background: var(--accent-color); color: #fff; }

    /* Video Grid */
    .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
    .video-card {
      background-color: var(--card-bg); border-radius: 12px; overflow: hidden;
      border: 1px solid var(--border-color); cursor: pointer; transition: transform 0.2s, border-color 0.2s;
      display: flex; flex-direction: column;
    }
    .video-card:hover { transform: translateY(-4px); border-color: var(--accent-color); }
    .thumbnail-box { position: relative; width: 100%; padding-top: 56.25%; background: #222; }
    .thumbnail-box img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    .card-info { padding: 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .card-title { font-size: 0.92rem; font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-channel { font-size: 0.8rem; color: var(--text-dim); }

    .loading-msg { text-align: center; padding: 40px; color: var(--text-dim); font-size: 1rem; grid-column: 1 / -1; }

    footer { text-align: center; padding: 20px; border-top: 1px solid var(--border-color); color: var(--text-dim); font-size: 0.85rem; }
  </style>
</head>
<body>

  <header>
    <div class="logo" onclick="fetchLiveTrending()">
      <span>▶</span> PH Tube Realtime
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Tìm kiếm video hoặc dán link YouTube...">
      <button onclick="handleSearch()">Tìm kiếm</button>
    </div>
  </header>

  <main>
    <!-- Server Player Control -->
    <div class="server-bar">
      <span style="font-size:0.88rem; color:#bbb;">🚀 Chọn Server Phát Mượt:</span>
      <div class="server-options">
        <button class="server-btn active" id="btn-invidious" onclick="setServer('invidious')">⚡ Invidious (Nhanh / Không QC)</button>
        <button class="server-btn" id="btn-nadeko" onclick="setServer('nadeko')">🌐 Server 2</button>
        <button class="server-btn" id="btn-youtube" onclick="setServer('youtube')">▶ YouTube Gốc</button>
      </div>
    </div>

    <!-- Player -->
    <div class="player-section">
      <div class="video-container">
        <iframe id="mainPlayer" src="" allow="accelerometer; autoplay; encrypted-media; gyroscope" allowfullscreen></iframe>
      </div>
      <div class="video-info">
        <div class="video-title" id="currentTitle">Đang tải danh sách video...</div>
      </div>
    </div>

    <!-- Live Trending Section -->
    <div>
      <div class="section-header">
        <div class="section-title">🔥 YouTube Việt Nam Trending (Tự Động Cập Nhật Mới Nhất)</div>
        <button class="refresh-btn" onclick="fetchLiveTrending()">🔄 Cập nhật ngay</button>
      </div>
      <div class="video-grid" id="videoGrid">
        <div class="loading-msg">⏳ Đang kết nối YouTube API để lấy danh sách xu hướng mới nhất...</div>
      </div>
    </div>
  </main>

  <footer>
    PH Tube &copy; 2026 - Real-time YouTube Trending No-Ads
  </footer>

  <script>
    let currentVideoId = "";
    let currentServer = "invidious";

    const serverEmbeds = {
      invidious: "https://yewtu.be/embed/",
      nadeko: "https://inv.nadeko.net/embed/",
      youtube: "https://www.youtube-nocookie.com/embed/"
    };

    function updatePlayer() {
      if (!currentVideoId) return;
      const player = document.getElementById("mainPlayer");
      player.src = `${serverEmbeds[currentServer]}${currentVideoId}?autoplay=1`;
    }

    function setServer(serverKey) {
      currentServer = serverKey;
      document.querySelectorAll(".server-btn").forEach(btn => btn.classList.remove("active"));
      document.getElementById(`btn-${serverKey}`).classList.add("active");
      updatePlayer();
    }

    function loadVideo(id, title) {
      currentVideoId = id;
      updatePlayer();
      document.getElementById("currentTitle").innerText = title || "Video YouTube";
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Tự động gọi API lấy video Trending Việt Nam Realtime
    async function fetchLiveTrending() {
      const grid = document.getElementById("videoGrid");
      grid.innerHTML = '<div class="loading-msg">⏳ Đang lấy dữ liệu xu hướng mới nhất từ YouTube VN...</div>';

      const apiInstances = [
        "https://inv.nadeko.net/api/v1/trending?region=VN",
        "https://yewtu.be/api/v1/trending?region=VN",
        "https://pipedapi.kavin.rocks/trending?region=VN"
      ];

      let dataFetched = false;

      for (let apiUrl of apiInstances) {
        try {
          const res = await fetch(apiUrl);
          if (!res.ok) continue;
          const videos = await res.json();

          if (Array.isArray(videos) && videos.length > 0) {
            renderTrendingVideos(videos);
            dataFetched = true;
            break;
          }
        } catch (e) {
          console.log("Server API lỗi, thử server dự phòng tiếp theo...", e);
        }
      }

      if (!dataFetched) {
        // Backup nếu tất cả API công khai bận
        grid.innerHTML = '<div class="loading-msg">⚠️ Server API bận. Vui lòng nhấn nút "🔄 Cập nhật ngay" hoặc gõ tên video vào ô tìm kiếm!</div>';
      }
    }

    function renderTrendingVideos(videos) {
      const grid = document.getElementById("videoGrid");
      grid.innerHTML = "";

      // Chọn video đầu tiên làm video phát mặc định
      if (videos.length > 0 && !currentVideoId) {
        const first = videos[0];
        const vId = first.videoId || first.url?.split("v=")[1];
        if (vId) {
          loadVideo(vId, first.title);
        }
      }

      videos.slice(0, 24).forEach(v => {
        const vId = v.videoId || (v.url ? v.url.split("v=")[1] : "");
        if (!vId) return;

        const title = v.title || "Video";
        const channel = v.author || v.uploaderName || "YouTube";
        const thumb = v.videoThumbnails ? v.videoThumbnails.find(t => t.quality === "medium")?.url : `https://img.youtube.com/vi/${vId}/hqdefault.jpg`;

        const card = document.createElement("div");
        card.className = "video-card";
        card.onclick = () => loadVideo(vId, title);
        card.innerHTML = `
          <div class="thumbnail-box">
            <img src="${thumb}" alt="${title}" onerror="this.src='https://img.youtube.com/vi/${vId}/hqdefault.jpg'">
          </div>
          <div class="card-info">
            <div class="card-title">${title}</div>
            <div class="card-channel">${channel}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function extractVideoId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : url;
    }

    async function handleSearch() {
      const input = document.getElementById("searchInput").value.trim();
      if (!input) return;

      const videoId = extractVideoId(input);
      if (videoId.length === 11) {
        loadVideo(videoId, "Video Đã Chọn");
      } else {
        // Tìm kiếm realtime qua API
        const grid = document.getElementById("videoGrid");
        grid.innerHTML = `<div class="loading-msg">🔍 Đang tìm kiếm "${input}"...</div>`;
        try {
          const res = await fetch(`https://inv.nadeko.net/api/v1/search?q=${encodeURIComponent(input)}`);
          const results = await res.json();
          if (Array.isArray(results) && results.length > 0) {
            renderTrendingVideos(results.filter(r => r.type === "video"));
          } else {
            window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(input)}`, '_blank');
          }
        } catch (e) {
          window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(input)}`, '_blank');
        }
      }
    }

    document.getElementById("searchInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") handleSearch();
    });

    // Tự động load Trending Realtime khi vừa mở web
    fetchLiveTrending();
  </script>
</body>
</html>
