<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PH Tube - Xem YouTube Không Quảng Cáo</title>
  <style>
    :root {
      --bg-color: #0d0d0d;
      --card-bg: #1a1a1a;
      --accent-color: #DB5304;
      --accent-hover: #ff6a1a;
      --text-color: #ffffff;
      --text-dim: #aaaaaa;
      --border-color: #2a2a2a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #000000;
      border-bottom: 1px solid var(--border-color);
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--accent-color);
      text-decoration: none;
      cursor: pointer;
    }

    .search-box {
      display: flex;
      flex: 1;
      max-width: 550px;
      gap: 8px;
    }

    .search-box input {
      flex: 1;
      padding: 10px 16px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--accent-color);
    }

    .search-box button {
      padding: 10px 20px;
      border-radius: 20px;
      border: none;
      background-color: var(--accent-color);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .search-box button:hover {
      background-color: var(--accent-hover);
    }

    main {
      display: flex;
      flex-direction: column;
      padding: 20px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      gap: 25px;
    }

    .player-section {
      width: 100%;
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      border: 1px solid var(--border-color);
    }

    .video-container {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      height: 0;
      overflow: hidden;
      background: #000;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .video-info {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .video-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: #fff;
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--accent-color);
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .video-card {
      background-color: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
    }

    .video-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-color);
    }

    .thumbnail-box {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background-color: #222;
    }

    .thumbnail-box img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-channel {
      font-size: 0.82rem;
      color: var(--text-dim);
    }

    footer {
      text-align: center;
      padding: 20px;
      margin-top: auto;
      border-top: 1px solid var(--border-color);
      color: var(--text-dim);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo" onclick="loadVideo('-VBc27cNC7A', 'NHẠC REMIX TIKTOK HAY NHẤT 2026')">
      <span>▶</span> PH Tube
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Dán link YouTube hoặc nhập ID video/từ khóa...">
      <button onclick="handleSearch()">Xem ngay</button>
    </div>
  </header>

  <main>
    <div class="player-section">
      <div class="video-container">
        <iframe id="mainPlayer" src="https://www.youtube-nocookie.com/embed/-VBc27cNC7A?autoplay=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>
      <div class="video-info">
        <div class="video-title" id="currentTitle">NHẠC REMIX TIKTOK HAY NHẤT 2026 | BXH NHẠC TRẺ REMIX HOT TREND 2026</div>
      </div>
    </div>

    <div>
      <div class="section-title">🎵 Nhạc Trend TikTok Việt Nam 2026 Hot Nhất</div>
      <div class="video-grid" id="playlistGrid"></div>
    </div>
  </main>

  <footer>
    PH Tube &copy; 2026 - Xem YouTube Nhúng Không Quảng Cáo
  </footer>

  <script>
    const tiktokPlaylist = [
      {
        id: "-VBc27cNC7A",
        title: "NHẠC REMIX TIKTOK HAY NHẤT 2026 | BXH NHẠC TRẺ REMIX HOT TREND 2026",
        channel: "DN TEAM"
      },
      {
        id: "t4LbQLsw4bc",
        title: "NHẠC REMIX TIKTOK TRIỆU VIEW - Top 20 Nhạc Hot TikTok 2026",
        channel: "Ness Remix"
      },
      {
        id: "EU9yrv9revU",
        title: "BXH NHẠC TRẺ REMIX HOT TREND 2026 | NHẠC TREND TIKTOK",
        channel: "DN TEAM"
      },
      {
        id: "IZT7fDdDyR4",
        title: "Nhạc Trẻ Ballad Hot Trend 2026 ♫ Top 20 Ca Khúc Hay Nhất",
        channel: "Mộng Mơ Ballad"
      },
      {
        id: "YQ8Ea1y8LB4",
        title: "NHẠC REMIX TIKTOK HAY 2026🔥NONSTOP 2026 DJ THÁI HOÀNG REMIX",
        channel: "Dolce Music"
      }
    ];

    function renderPlaylist() {
      const grid = document.getElementById("playlistGrid");
      grid.innerHTML = "";
      tiktokPlaylist.forEach(video => {
        const card = document.createElement("div");
        card.className = "video-card";
        card.onclick = () => loadVideo(video.id, video.title);
        card.innerHTML = `
          <div class="thumbnail-box">
            <img src="https://img.youtube.com/vi/${video.id}/hqdefault.jpg" alt="${video.title}">
          </div>
          <div class="card-info">
            <div class="card-title">${video.title}</div>
            <div class="card-channel">${video.channel}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function loadVideo(id, title) {
      const player = document.getElementById("mainPlayer");
      player.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1`;
      document.getElementById("currentTitle").innerText = title || "Video YouTube Không Quảng Cáo";
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function extractVideoId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : url;
    }

    function handleSearch() {
      const input = document.getElementById("searchInput").value.trim();
      if (!input) return;
      const videoId = extractVideoId(input);
      if (videoId.length === 11) {
        loadVideo(videoId, "Video YouTube Đã Chọn");
      } else {
        window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(input)}`, '_blank');
      }
    }

    document.getElementById("searchInput").addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        handleSearch();
      }
    });

    renderPlaylist();
  </script>
</body>
</html>
